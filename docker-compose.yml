# docker-compose.yml — целевая конфигурация для self-host deploy (см. docs/ARCHITECTURE.md §10).
# Локально на хосте тоже работает: docker compose up -d.
# Переменные окружения берутся из .env (рядом, не коммитится — см. .env.example).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meal}
      POSTGRES_DB: ${POSTGRES_DB:-meal_planner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-meal} -d ${POSTGRES_DB:-meal_planner}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meal}:${POSTGRES_PASSWORD:-meal}@postgres:5432/${POSTGRES_DB:-meal_planner}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    ports:
      - '3000:3000'

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meal}:${POSTGRES_PASSWORD:-meal}@postgres:5432/${POSTGRES_DB:-meal_planner}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APPLE_ID: ${APPLE_ID:-}
      APPLE_APP_PASSWORD: ${APPLE_APP_PASSWORD:-}
      APPLE_REMINDERS_LIST: ${APPLE_REMINDERS_LIST:-Daily}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  postgres_data:
