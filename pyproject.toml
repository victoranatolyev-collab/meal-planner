[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner"
version = "0.1.0"
description = "Weekly meal planning with KBJU/budget/iron-rule validation and HTML/markdown rendering"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Victor"}]
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0,<3",
    "click>=8.0,<9",
    "jinja2>=3.0,<4",
    "rich>=13.0,<16",
    "questionary>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=7.0,<10"]

[project.scripts]
meal-planner = "meal_planner.__main__:cli"
mp = "meal_planner.__main__:cli"

[tool.setuptools.packages.find]
include = ["meal_planner*"]
exclude = ["tests*", "data*", "plans*", "output*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
